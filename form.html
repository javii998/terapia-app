<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cuestionario — Terapia Ocupacional</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6ff;color:#1f2937;min-height:100vh;}
header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;padding:20px 16px 16px;text-align:center;}
header h1{font-size:1.15em;font-weight:700;margin-bottom:4px;}
header p{font-size:0.85em;opacity:0.85;}
.progress-wrap{background:#e0e0f8;height:6px;width:100%;}
.progress-bar{background:#6366f1;height:6px;transition:width .3s;}
.progress-label{text-align:center;font-size:0.8em;color:#6b7280;padding:8px 0 4px;}
.scale-step{background:#e0e7ff;text-align:center;padding:8px 14px;font-size:0.82em;color:#4338ca;font-weight:600;border-bottom:1px solid #c7d2fe;}
.card{background:white;border-radius:14px;margin:12px 14px;padding:20px;box-shadow:0 2px 8px rgba(99,102,241,.1);}
.q-num{font-size:0.75em;color:#9ca3af;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
.q-domain{display:inline-block;font-size:0.72em;background:#e0e7ff;color:#6366f1;border-radius:10px;padding:2px 9px;margin-bottom:8px;font-weight:600;}
.q-text{font-size:1em;font-weight:600;color:#1f2937;line-height:1.4;margin-bottom:16px;}
.option-btn{display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:8px;border-radius:10px;border:2px solid #e5e7eb;background:white;font-size:0.95em;cursor:pointer;transition:all .15s;color:#374151;}
.option-btn:hover{border-color:#6366f1;background:#f0f0ff;}
.option-btn.selected{border-color:#6366f1;background:#6366f1;color:white;}
.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 20px;}
.btn{padding:12px 24px;border-radius:10px;border:none;font-size:1em;font-weight:600;cursor:pointer;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-prev{background:#f3f4f6;color:#374151;}
.btn-next{background:#6366f1;color:white;}
.btn-send{background:linear-gradient(135deg,#10b981,#059669);color:white;}
.overview-item{background:white;border-radius:12px;margin:8px 14px;padding:14px 16px;box-shadow:0 1px 4px rgba(99,102,241,.08);display:flex;justify-content:space-between;align-items:center;gap:12px;}
.oi-name{font-weight:700;font-size:.97em;color:#1f2937;}
.oi-count{font-size:.8em;color:#9ca3af;margin-top:2px;}
.oi-btn{padding:8px 16px;border-radius:8px;border:none;font-size:.85em;font-weight:600;cursor:pointer;}
.screen{text-align:center;padding:60px 24px;}
.screen .icon{font-size:4em;margin-bottom:16px;}
.screen h2{margin-bottom:8px;}
.screen p{color:#6b7280;font-size:.95em;line-height:1.5;}
.loading{text-align:center;padding:80px 24px;color:#6b7280;}
.spinner{border:4px solid #e0e7ff;border-top:4px solid #6366f1;border-radius:50%;width:44px;height:44px;animation:spin 1s linear infinite;margin:0 auto 20px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="hdr"></div>
<div id="pbar-wrap" style="display:none">
  <div class="progress-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
  <div class="progress-label" id="plabel"></div>
</div>
<div id="scale-step" style="display:none" class="scale-step"></div>
<div id="app"><div class="loading"><div class="spinner"></div><p>Cargando cuestionario…</p></div></div>

<script>
(async function() {
  const params = new URLSearchParams(location.search);
  const formId = params.get('id');
  const token  = params.get('t');

  function showError(msg) {
    document.getElementById('app').innerHTML =
      '<div class="screen"><div class="icon">❌</div><h2 style="color:#dc2626;">Error</h2><p>' + msg + '</p></div>';
  }

  if (!formId || !token) {
    showError('Enlace inválido o incompleto. Pide al terapeuta que te reenvíe el enlace.');
    return;
  }

  let cfg;
  try {
    const r = await fetch('https://raw.githubusercontent.com/javii998/terapia-recursos/main/form-configs/' + formId + '.json?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    cfg = await r.json();
  } catch(e) {
    showError('No se pudo cargar el cuestionario (' + e.message + '). Puede que el enlace haya expirado.');
    return;
  }

  // Normalize: single scale OR bundle → always array of scaleBlocks
  let scaleBlocks;
  if (cfg.type === 'bundle' && Array.isArray(cfg.scales)) {
    scaleBlocks = cfg.scales.filter(s => Array.isArray(s.items) && s.items.length > 0);
  } else {
    scaleBlocks = Array.isArray(cfg.items) && cfg.items.length > 0
      ? [{ scaleId: cfg.scaleId, scaleName: cfg.scaleName, items: cfg.items }]
      : [];
  }

  if (scaleBlocks.length === 0) {
    showError('Este cuestionario no tiene preguntas configuradas.');
    return;
  }

  const isBundle = scaleBlocks.length > 1;

  // Header
  document.getElementById('hdr').innerHTML =
    '<header>' +
      '<h1>📋 ' + (isBundle ? scaleBlocks.length + ' cuestionarios' : cfg.scaleName) + '</h1>' +
      '<p>Paciente: <strong>' + cfg.patientName + '</strong></p>' +
    '</header>';

  // State
  const allAnswers = scaleBlocks.map(b => new Array(b.items.length).fill(null));
  const submitted  = new Array(scaleBlocks.length).fill(false);
  let scaleIdx = 0;
  let itemIdx  = 0;

  // ── Overview (bundle only) ───────────────────────────────────────────────
  function showOverview() {
    document.getElementById('pbar-wrap').style.display = 'none';
    document.getElementById('scale-step').style.display = 'none';
    const doneCount = submitted.filter(Boolean).length;
    let html = '<div style="padding:14px 0 4px 14px;font-weight:700;color:#374151;font-size:.95em;">Cuestionarios — ' + doneCount + ' de ' + scaleBlocks.length + ' enviados</div>';
    scaleBlocks.forEach((b, i) => {
      const isDone = submitted[i];
      // Allow starting the next pending scale (and also re-do ones not yet sent if going back)
      const canStart = !isDone;
      html += '<div class="overview-item">' +
        '<div style="flex:1"><div class="oi-name">' + (i+1) + '. ' + b.scaleName + '</div>' +
        '<div class="oi-count">' + b.items.length + ' preguntas</div></div>' +
        (isDone
          ? '<span style="color:#10b981;font-weight:700;font-size:.85em;">✓ Enviado</span>'
          : canStart
            ? '<button class="oi-btn" style="background:#6366f1;color:white;" onclick="startScale(' + i + ')">Comenzar →</button>'
            : '<span style="color:#9ca3af;font-size:.85em;">Pendiente</span>'
        ) +
      '</div>';
    });
    if (doneCount === scaleBlocks.length) {
      html += '<div class="screen"><div class="icon">🎉</div><h2 style="color:#10b981;">¡Todos completados!</h2>' +
        '<p>Gracias por completar todos los cuestionarios.<br>Puedes cerrar esta página.</p></div>';
    }
    document.getElementById('app').innerHTML = html;
  }

  // ── Start a scale ────────────────────────────────────────────────────────
  window.startScale = function(i) { scaleIdx = i; itemIdx = 0; renderItem(); };

  // ── Render one item ──────────────────────────────────────────────────────
  function renderItem() {
    const block   = scaleBlocks[scaleIdx];
    const items   = block.items;
    const answers = allAnswers[scaleIdx];
    const it      = items[itemIdx];
    const sel     = answers[itemIdx];
    const isLast  = itemIdx === items.length - 1;

    // Progress bar
    const pbarWrap = document.getElementById('pbar-wrap');
    pbarWrap.style.display = 'block';
    document.getElementById('pbar').style.width = Math.round((itemIdx / items.length) * 100) + '%';
    document.getElementById('plabel').textContent = 'Pregunta ' + (itemIdx + 1) + ' de ' + items.length;

    // Scale step banner (bundle only)
    if (isBundle) {
      const ss = document.getElementById('scale-step');
      ss.style.display = 'block';
      ss.textContent = 'Cuestionario ' + (scaleIdx + 1) + ' de ' + scaleBlocks.length + ': ' + block.scaleName;
    }

    // Nav: "← Anterior" goes back to overview if at first item of a bundle scale
    const prevDisabled = itemIdx === 0 && (!isBundle || scaleIdx === 0) ? 'disabled' : '';
    const prevAction   = (itemIdx === 0 && isBundle) ? 'showOverview()' : 'prevItem()';

    document.getElementById('app').innerHTML =
      '<div class="card">' +
        '<div class="q-num">Pregunta ' + (itemIdx + 1) + ' / ' + items.length + '</div>' +
        (it.description ? '<span class="q-domain">' + it.description + '</span>' : '') +
        '<div class="q-text">' + (it.name || '').replace(/^[A-Z]{2}\d+ — /, '') + '</div>' +
        (it.options || []).map((o, oi) =>
          '<button class="option-btn' + (sel !== null && sel.optionIndex === oi ? ' selected' : '') +
          '" onclick="pick(' + oi + ')">' + (o.text || o.label || '') + '</button>'
        ).join('') +
      '</div>' +
      '<div class="nav">' +
        '<button class="btn btn-prev" onclick="' + prevAction + '" ' + prevDisabled + '>← Anterior</button>' +
        (isLast
          ? '<button class="btn btn-send" onclick="submitScale()" ' + (sel === null ? 'disabled' : '') + '>Enviar ✓</button>'
          : '<button class="btn btn-next" onclick="nextItem()"    ' + (sel === null ? 'disabled' : '') + '>Siguiente →</button>'
        ) +
      '</div>';
  }

  window.pick = function(oi) {
    const o = scaleBlocks[scaleIdx].items[itemIdx].options[oi];
    allAnswers[scaleIdx][itemIdx] = {
      optionIndex: oi,
      text:   o.text   || o.label || '',
      points: typeof o.points === 'number' ? o.points : (typeof o.value === 'number' ? o.value : 0)
    };
    renderItem();
  };
  window.prevItem    = function() { if (itemIdx > 0) { itemIdx--; renderItem(); } };
  window.nextItem    = function() { if (allAnswers[scaleIdx][itemIdx] !== null) { itemIdx++; renderItem(); } };
  window.showOverview = showOverview;

  // ── Submit one scale ─────────────────────────────────────────────────────
  window.submitScale = async function() {
    const block   = scaleBlocks[scaleIdx];
    const answers = allAnswers[scaleIdx];
    const unanswered = answers.filter(a => a === null).length;
    if (unanswered > 0 && !confirm('Hay ' + unanswered + ' pregunta(s) sin responder. ¿Enviar de todas formas?')) return;

    document.getElementById('app').innerHTML = '<div class="screen"><div class="spinner"></div><p>Enviando…</p></div>';

    const payload = {
      formId:      cfg.formId + '_s' + scaleIdx + '_' + block.scaleId,
      patientId:   cfg.patientId,
      patientName: cfg.patientName,
      submittedAt: new Date().toISOString(),
      scaleId:     block.scaleId,
      scaleName:   block.scaleName,
      answers: block.items.map((it, i) => ({
        itemName:       it.name,
        points:         answers[i] ? answers[i].points : 0,
        selectedOption: answers[i] ? answers[i].text   : 'Sin respuesta'
      }))
    };

    const fileName = cfg.formId + '_' + block.scaleId + '_' + Date.now() + '.json';
    const content  = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
    try {
      const r = await fetch('https://api.github.com/repos/javii998/terapia-recursos/contents/form-responses/' + fileName, {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'Respuesta ' + cfg.formId + ' — ' + block.scaleName, content, branch: 'main' })
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);

      submitted[scaleIdx] = true;
      document.getElementById('pbar').style.width = '100%';
      const remaining = submitted.filter(x => !x).length;

      if (!isBundle) {
        // Single scale — final done screen
        document.getElementById('pbar-wrap').style.display = 'none';
        document.getElementById('app').innerHTML =
          '<div class="screen"><div class="icon">✅</div><h2 style="color:#10b981;">¡Enviado!</h2>' +
          '<p>Las respuestas han sido enviadas correctamente.<br>Puedes cerrar esta página.</p></div>';
      } else if (remaining === 0) {
        // Bundle — all done
        document.getElementById('pbar-wrap').style.display = 'none';
        document.getElementById('scale-step').style.display = 'none';
        document.getElementById('app').innerHTML =
          '<div class="screen"><div class="icon">🎉</div><h2 style="color:#10b981;">¡Todos completados!</h2>' +
          '<p>Has completado todos los cuestionarios.<br>Puedes cerrar esta página.</p></div>';
      } else {
        // Bundle — more pending
        const nextIdx = scaleBlocks.findIndex((_, i) => !submitted[i]);
        document.getElementById('pbar-wrap').style.display = 'none';
        document.getElementById('scale-step').style.display = 'none';
        document.getElementById('app').innerHTML =
          '<div class="screen">' +
            '<div class="icon">✅</div>' +
            '<h2 style="color:#10b981;">' + block.scaleName + '<br><small style="font-size:.6em;font-weight:400;">enviado correctamente</small></h2>' +
            '<p style="margin-bottom:28px;">Quedan <strong>' + remaining + '</strong> cuestionario(s) pendiente(s).</p>' +
            '<button class="btn btn-next" style="display:block;margin:0 auto 12px;" onclick="startScale(' + nextIdx + ')">Siguiente cuestionario →</button>' +
            '<button class="btn btn-prev" style="display:block;margin:0 auto;font-size:.85em;" onclick="showOverview()">Ver todos los cuestionarios</button>' +
          '</div>';
      }
    } catch(e) {
      document.getElementById('app').innerHTML =
        '<div class="screen"><div class="icon">❌</div><h2 style="color:#dc2626;">Error al enviar</h2>' +
        '<p>No se pudieron enviar las respuestas (' + e.message + ').<br>Tus respuestas no se han perdido.</p>' +
        '<button class="btn btn-next" style="display:block;margin:16px auto 0;" onclick="renderItem()">Reintentar</button></div>';
      window.renderItem = renderItem;
    }
  };

  // ── Entry point ──────────────────────────────────────────────────────────
  if (isBundle) {
    showOverview();
  } else {
    renderItem();
  }
})();
</script>
</body>
</html>
