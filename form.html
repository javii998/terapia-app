<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cuestionario — Terapia Ocupacional</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6ff;color:#1f2937;min-height:100vh;}
header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;padding:20px 16px 16px;text-align:center;}
header h1{font-size:1.15em;font-weight:700;margin-bottom:4px;}
header p{font-size:0.85em;opacity:0.85;}
.progress-wrap{background:#e0e0f8;height:6px;width:100%;}
.progress-bar{background:#6366f1;height:6px;transition:width .3s;}
.progress-label{text-align:center;font-size:0.8em;color:#6b7280;padding:8px 0 4px;}
.card{background:white;border-radius:14px;margin:12px 14px;padding:20px;box-shadow:0 2px 8px rgba(99,102,241,.1);}
.q-num{font-size:0.75em;color:#9ca3af;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
.q-domain{display:inline-block;font-size:0.72em;background:#e0e7ff;color:#6366f1;border-radius:10px;padding:2px 9px;margin-bottom:8px;font-weight:600;}
.q-text{font-size:1em;font-weight:600;color:#1f2937;line-height:1.4;margin-bottom:16px;}
.option-btn{display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:8px;border-radius:10px;border:2px solid #e5e7eb;background:white;font-size:0.95em;cursor:pointer;transition:all .15s;color:#374151;}
.option-btn:hover{border-color:#6366f1;background:#f0f0ff;}
.option-btn.selected{border-color:#6366f1;background:#6366f1;color:white;}
.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 20px;}
.btn{padding:12px 24px;border-radius:10px;border:none;font-size:1em;font-weight:600;cursor:pointer;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-prev{background:#f3f4f6;color:#374151;}
.btn-next{background:#6366f1;color:white;}
.btn-submit{background:linear-gradient(135deg,#10b981,#059669);color:white;width:calc(100% - 28px);margin:0 14px 20px;display:block;padding:15px;border-radius:12px;font-size:1.05em;border:none;font-weight:700;cursor:pointer;}
.screen{text-align:center;padding:60px 24px;}
.screen .icon{font-size:4em;margin-bottom:16px;}
.screen h2{margin-bottom:8px;}
.screen p{color:#6b7280;font-size:0.95em;line-height:1.5;}
.loading{text-align:center;padding:80px 24px;color:#6b7280;}
.spinner{border:4px solid #e0e7ff;border-top:4px solid #6366f1;border-radius:50%;width:44px;height:44px;animation:spin 1s linear infinite;margin:0 auto 20px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"><div class="loading"><div class="spinner"></div><p>Cargando cuestionario…</p></div></div>

<script>
(async function() {
  const params = new URLSearchParams(location.search);
  const formId = params.get('id');
  const token  = params.get('t');

  function showError(msg) {
    document.getElementById('root').innerHTML = '<div class="screen"><div class="icon">❌</div><h2 style="color:#dc2626;">Error</h2><p>' + msg + '</p></div>';
  }

  if (!formId || !token) {
    showError('Enlace inválido o incompleto. Pide al terapeuta que te reenvíe el enlace.');
    return;
  }

  let cfg;
  try {
    const r = await fetch('https://raw.githubusercontent.com/javii998/terapia-recursos/main/form-configs/' + formId + '.json?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    cfg = await r.json();
  } catch(e) {
    showError('No se pudo cargar el cuestionario (' + e.message + '). Puede que el enlace haya expirado.');
    return;
  }

  const items = cfg.items || [];
  if (items.length === 0) {
    showError('Este cuestionario no tiene preguntas configuradas.');
    return;
  }

  // ── Render engine ────────────────────────────────────────────────────
  let idx = 0;
  const answers = new Array(items.length).fill(null);

  document.getElementById('root').innerHTML = `
    <header>
      <h1>📋 ${cfg.scaleName}</h1>
      <p>Paciente: <strong>${cfg.patientName}</strong></p>
    </header>
    <div class="progress-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
    <div class="progress-label" id="plabel"></div>
    <div id="app"></div>`;

  function render() {
    const it  = items[idx];
    const pct = Math.round((idx / items.length) * 100);
    document.getElementById('pbar').style.width = pct + '%';
    document.getElementById('plabel').textContent = 'Pregunta ' + (idx + 1) + ' de ' + items.length;
    const sel = answers[idx];
    const isLast = idx === items.length - 1;
    document.getElementById('app').innerHTML =
      '<div class="card">' +
        '<div class="q-num">Pregunta ' + (idx + 1) + ' / ' + items.length + '</div>' +
        (it.description ? '<span class="q-domain">' + it.description + '</span>' : '') +
        '<div class="q-text">' + it.name.replace(/^[A-Z]{2}\d+ — /, '') + '</div>' +
        it.options.map((o, i) =>
          '<button class="option-btn' + (sel !== null && sel.optionIndex === i ? ' selected' : '') +
          '" onclick="pick(' + i + ')">' + o.text + '</button>'
        ).join('') +
      '</div>' +
      '<div class="nav">' +
        '<button class="btn btn-prev" onclick="prev()" ' + (idx === 0 ? 'disabled' : '') + '>← Anterior</button>' +
        (isLast
          ? '<button class="btn btn-next" onclick="trySubmit()" ' + (sel === null ? 'disabled' : '') + '>Enviar ✓</button>'
          : '<button class="btn btn-next" onclick="next()" '     + (sel === null ? 'disabled' : '') + '>Siguiente →</button>'
        ) +
      '</div>';
  }

  window.pick = function(i) {
    answers[idx] = { optionIndex: i, text: items[idx].options[i].text, points: items[idx].options[i].points };
    render();
  };
  window.prev = function() { if (idx > 0) { idx--; render(); } };
  window.next = function() { if (answers[idx] !== null && idx < items.length - 1) { idx++; render(); } };

  window.trySubmit = async function() {
    const unanswered = answers.filter(a => a === null).length;
    if (unanswered > 0 && !confirm('Hay ' + unanswered + ' pregunta(s) sin responder. ¿Enviar de todas formas?')) return;

    const payload = {
      formId: cfg.formId,
      patientId: cfg.patientId,
      patientName: cfg.patientName,
      scaleId: cfg.scaleId,
      scaleName: cfg.scaleName,
      submittedAt: new Date().toISOString(),
      answers: items.map((it, i) => ({
        itemName: it.name,
        points: answers[i] ? answers[i].points : 0,
        selectedOption: answers[i] ? answers[i].text : 'Sin respuesta'
      }))
    };

    document.getElementById('app').innerHTML = '<div class="screen"><div class="spinner"></div><p>Enviando respuestas…</p></div>';

    const fileName = cfg.formId + '_' + Date.now() + '.json';
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
    try {
      const r = await fetch('https://api.github.com/repos/javii998/terapia-recursos/contents/form-responses/' + fileName, {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'Respuesta cuestionario ' + cfg.formId, content, branch: 'main' })
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      document.getElementById('app').innerHTML =
        '<div class="screen"><div class="icon">✅</div><h2 style="color:#10b981;">¡Enviado!</h2>' +
        '<p>Las respuestas han sido enviadas correctamente.<br>Puedes cerrar esta página.</p></div>';
      document.getElementById('pbar').style.width = '100%';
      document.getElementById('plabel').textContent = 'Completado';
    } catch(e) {
      document.getElementById('app').innerHTML =
        '<div class="screen"><div class="icon">❌</div><h2 style="color:#dc2626;">Error al enviar</h2>' +
        '<p>No se pudieron enviar las respuestas (' + e.message + ').<br>' +
        'Haz una captura de pantalla o toma nota y comunícaselo al terapeuta.</p></div>';
    }
  };

  render();
})();
</script>
</body>
</html>
